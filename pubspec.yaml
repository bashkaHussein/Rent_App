name: renting_app
description: "A new Flutter project."
publish_to: 'none' # Prevent publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_iconly: ^1.0.2
  cupertino_icons: ^1.0.8
  curved_navigation_bar: ^1.0.6
  smooth_page_indicator: ^1.2.0
  provider: ^6.1.5+1
  http: ^1.5.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/

# flutter_launcher_icons configuration (must be at root, not under dependencies)
flutter_icons:
  android: true
  ios: true
  image_path: "assets/image.png"
  # optional adaptive icon for Android
  # adaptive_icon_background: "#FFFFFF"
  # adaptive_icon_foreground: "assets/image1.png"
